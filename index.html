<script>
/* ==================================================================
   0. UUID 生成器（兼容 HTTP 非安全上下文）
   ================================================================== */
function uuid() {
  if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
    return crypto.randomUUID();
  }
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

/* ==================================================================
   1. 虚拟文件系统（IndexedDB）
   ================================================================== */
const DB_NAME = 'XP_VFS', DB_VER = 2;
const NODES = 'nodes', META = 'meta', ROOT_ID = 'root';

class VFS {
  async init() {
    this.db = await new Promise((res, rej) => {
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(NODES)) {
          const s = db.createObjectStore(NODES, { keyPath: 'id' });
          s.createIndex('parentId', 'parentId');
        }
        if (!db.objectStoreNames.contains(META)) {
          db.createObjectStore(META, { keyPath: 'key' });
        }
      };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
    return this;
  }

  tx(mode = 'readonly') { return this.db.transaction(NODES, mode).objectStore(NODES); }
  mtx(mode = 'readonly') { return this.db.transaction(META, mode).objectStore(META); }
  req(r) {
    return new Promise((res, rej) => {
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }

  async getMeta(key) { const r = await this.req(this.mtx().get(key)); return r ? r.value : undefined; }
  setMeta(key, value) { return this.req(this.mtx('readwrite').put({ key, value })); }

  get(id) { return this.req(this.tx().get(id)); }
  children(parentId) { return this.req(this.tx().index('parentId').getAll(parentId)); }
  async find(parentId, name) { return (await this.children(parentId)).find(n => n.name === name); }

  async ensureRoot() {
    if (!await this.get(ROOT_ID)) {
      await this.req(this.tx('readwrite').add({
        id: ROOT_ID, parentId: null, name: '', type: 'dir',
        createdAt: Date.now(), updatedAt: Date.now()
      }));
    }
  }

  async wipe() {
    await this.req(this.tx('readwrite').clear());
    await this.req(this.mtx('readwrite').clear());
    await this.ensureRoot();
  }

  async resolve(path) {
    const parts = path.split('/').filter(Boolean);
    let cur = await this.get(ROOT_ID);
    if (!cur) return null;
    for (const p of parts) {
      cur = await this.find(cur.id, p);
      if (!cur) return null;
    }
    return cur;
  }

  mkdir(parentId, name) {
    const now = Date.now();
    return this.req(this.tx('readwrite').add({
      id: uuid(), parentId, name, type: 'dir',
      createdAt: now, updatedAt: now
    }));
  }

  async writeFile(parentId, name, content, mime = 'text/plain') {
    const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
    const now = Date.now();
    const node = await this.find(parentId, name);
    if (node) {
      node.content = blob; node.size = blob.size; node.updatedAt = now;
      return this.req(this.tx('readwrite').put(node));
    }
    return this.req(this.tx('readwrite').add({
      id: uuid(), parentId, name, type: 'file',
      content: blob, size: blob.size, mime, createdAt: now, updatedAt: now
    }));
  }

  async readFile(id) {
    const n = await this.get(id);
    return n && n.type === 'file' ? n.content.text() : null;
  }

  async remove(id) {
    if (id === ROOT_ID) return;
    for (const k of await this.children(id)) await this.remove(k.id);
    return this.req(this.tx('readwrite').delete(id));
  }
}

/* ==================================================================
   3. 工具
   ================================================================== */
const screenEl = document.getElementById('screen');
const sleep = ms => new Promise(r => setTimeout(r, ms));

function mount(cls) {
  screenEl.innerHTML = '';
  const el = document.createElement('div');
  el.className = cls;
  el.style.height = '100%';
  screenEl.appendChild(el);
  return el;
}

class Terminal {
  constructor(el) { this.el = el; }
  print(text = '') {
    const d = document.createElement('div');
    d.textContent = text;
    this.el.appendChild(d);
    this.el.scrollTop = this.el.scrollHeight;
    return d;
  }
  async type(text, speed = 3) {
    const d = this.print('');
    for (let i = 0; i < text.length; i++) {
      d.textContent = text.slice(0, i + 1);
      if (speed) await sleep(speed);
    }
    this.el.scrollTop = this.el.scrollHeight;
    return d;
  }
  async typeAll(lines, speed = 3) { for (const l of lines) await this.type(l, speed); }
}

const bar = (pct, w = 40) => {
  const n = Math.round(pct / 100 * w);
  return '[' + '█'.repeat(n) + '░'.repeat(w - n) + ']';
};

const splitPath = p => {
  const i = p.lastIndexOf('/');
  return { dir: p.slice(0, i) || '/', name: p.slice(i + 1) };
};

function autoAdvance(ms = 1200) {
  return new Promise(resolve => {
    let done = false;
    const fire = () => {
      if (done) return;
      done = true;
      cleanup();
      resolve('skip');
    };
    const cleanup = () => {
      window.removeEventListener('mousedown', fire, true);
      window.removeEventListener('touchstart', fire, true);
      window.removeEventListener('keydown', fire, true);
    };
    window.addEventListener('mousedown', fire, true);
    window.addEventListener('touchstart', fire, true);
    window.addEventListener('keydown', fire, true);
    setTimeout(() => { if (!done) { done = true; cleanup(); resolve('timeout'); } }, ms);
  });
}

/* ==================================================================
   4. 安装状态检查
   ================================================================== */
const CRITICAL_PATHS = [
  '/WINDOWS/system32/ntoskrnl.exe',
  '/WINDOWS/system32/kernel32.dll',
  '/WINDOWS/system32/user32.dll',
  '/WINDOWS/explorer.exe',
  '/Program Files/Internet Explorer/iexplore.exe',
];

async function inspectInstallation(vfs) {
  const phase = await vfs.getMeta('phase');
  if (!phase)              return { state: 'fresh' };
  if (phase === 'gui')     return { state: 'resume-gui' };
  if (phase === 'oobe')    return { state: 'resume-oobe' };

  if (phase === 'done') {
    const missing = [];
    for (const p of CRITICAL_PATHS) {
      if (!await vfs.resolve(p)) missing.push(p);
    }
    const user = await vfs.getMeta('user');
    if (!user) missing.push('用户配置 (meta.user)');
    if (missing.length) return { state: 'corrupt', missing };
    return { state: 'installed', user };
  }
  return { state: 'fresh' };
}

/* ==================================================================
   5. 重装系统文件（修复用）
   ================================================================== */
async function reinstallSystemFiles(vfs) {
  for (const f of SYSTEM_FILES) {
    const { dir, name } = splitPath(f.p);
    const parent = await vfs.resolve(dir);
    if (!parent) continue;
    if (f.t === 'd') {
      if (!await vfs.find(parent.id, name)) await vfs.mkdir(parent.id, name);
    } else {
      const mime = /\.(txt|ini|log|bat)$/i.test(name) ? 'text/plain' : 'application/octet-stream';
      await vfs.writeFile(parent.id, name, f.c, mime);
    }
  }
}

/* ---------- 窗口 ---------- */
function createWindow({ title, width = 520, height = 340, html = '' }) {
  const desktopEl = document.getElementById('desktop');
  const win = document.createElement('div');
  win.className = 'window';
  win.style.width = width + 'px';
  win.style.height = height + 'px';
  const off = (winCount % 6) * 26;
  win.style.left = (100 + off) + 'px';
  win.style.top  = (50 + off) + 'px';
  win.style.zIndex = ++zTop;
  winCount++;

  win.innerHTML = `
    <div class="titlebar">
      <span class="title">${title}</span>
      <div class="controls">
        <button class="btn-min" title="最小化">─</button>
        <button class="btn-close" title="关闭">✕</button>
      </div>
    </div>
    <div class="win-body">${html}</div>`;
  desktopEl.appendChild(win);

  const tb = document.createElement('button');
  tb.className = 'task-btn';
  tb.textContent = title;
  document.getElementById('taskbar-tasks').appendChild(tb);

  let minimized = false;
  const focusWin = () => {
    win.style.zIndex = ++zTop;
    document.querySelectorAll('.window').forEach(w => w.classList.remove('focused'));
    win.classList.add('focused');
    document.querySelectorAll('.task-btn').forEach(b => b.classList.remove('active'));
    tb.classList.add('active');
  };
  win.addEventListener('mousedown', focusWin, true);
  win.querySelector('.btn-close').onclick = () => { win.remove(); tb.remove(); };
  win.querySelector('.btn-min').onclick = () => {
    minimized = true; win.style.display = 'none'; tb.classList.remove('active');
  };
  tb.onclick = () => {
    if (minimized) { minimized = false; win.style.display = 'flex'; focusWin(); }
    else if (tb.classList.contains('active')) {
      minimized = true; win.style.display = 'none'; tb.classList.remove('active');
    } else focusWin();
  };

  const barEl = win.querySelector('.titlebar');
  barEl.addEventListener('mousedown', e => {
    if (e.target.closest('.controls')) return;
    const r = win.getBoundingClientRect();
    const dx = e.clientX - r.left, dy = e.clientY - r.top;
    const move = ev => {
      win.style.left = Math.max(-r.width + 80,
        Math.min(window.innerWidth - 60, ev.clientX - dx)) + 'px';
      win.style.top = Math.max(0,
        Math.min(window.innerHeight - 60, ev.clientY - dy)) + 'px';
    };
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });

  focusWin();
  return win;
}

/* ---------- 文件类型图标 ---------- */
function fileEmoji(name, type) {
  if (type === 'dir') return '📁';
  if (/\.(exe|com)$/i.test(name)) return '⚙️';
  if (/\.dll$/i.test(name)) return '🧩';
  if (/\.(jpg|png|bmp)$/i.test(name)) return '🖼️';
  if (/\.(wav|mp3)$/i.test(name)) return '🎵';
  return '📄';
}

/* ---------- 文件夹浏览 ---------- */
async function openFolder(folderId, title) {
  const vfs = vfsRef;
  const win = createWindow({ title, width: 620, height: 420 });
  const body = win.querySelector('.win-body');
  body.style.padding = '0';

  const kids = (await vfs.children(folderId))
    .sort((a, b) => (a.type === b.type ? a.name.localeCompare(b.name)
                                       : a.type === 'dir' ? -1 : 1));

  if (!kids.length) {
    body.innerHTML = '<div style="padding:24px;color:#888">这个文件夹是空的。</div>';
    return;
  }

  for (const n of kids) {
    const row = document.createElement('div');
    row.className = 'file-row';
    row.innerHTML = `
      <span class="emoji">${fileEmoji(n.name, n.type)}</span>
      <div>
        <div style="font-weight:bold">${n.name}</div>
        <div style="color:#777">${n.type === 'dir' ? '文件夹' : (n.size || 0) + ' 字节'}</div>
      </div>`;
    row.addEventListener('dblclick', async () => {
      if (n.type === 'dir') openFolder(n.id, n.name);
      else {
        const text = await vfs.readFile(n.id);
        openNotepad(text ?? '[二进制文件，无法以文本显示]', n.name, n.id, folderId);
      }
    });
    body.appendChild(row);
  }
}

/* ---------- 我的电脑 ---------- */
async function openMyComputer() {
  const vfs = vfsRef;
  const win = createWindow({ title: '我的电脑', width: 640, height: 420 });
  const body = win.querySelector('.win-body');
  body.style.padding = '0';

  const root = await vfs.resolve('/');
  const kids = (await vfs.children(root.id))
    .sort((a, b) => (a.type === b.type ? a.name.localeCompare(b.name)
                                       : a.type === 'dir' ? -1 : 1));

  body.innerHTML = '<div style="padding:14px 18px 6px;font-weight:bold;color:#0046a8">硬盘</div>';

  for (const n of kids) {
    const row = document.createElement('div');
    row.className = 'file-row';
    row.style.padding = '7px 18px';
    row.innerHTML = `
      <span class="emoji">${fileEmoji(n.name, n.type)}</span>
      <div>
        <div style="font-weight:bold">${n.name}</div>
        <div style="color:#777">${n.type === 'dir' ? '文件夹' : (n.size || 0) + ' 字节'}</div>
      </div>`;
    row.addEventListener('dblclick', async () => {
      if (n.type === 'dir') openFolder(n.id, n.name);
      else openNotepad(await vfs.readFile(n.id), n.name, n.id, root.id);
    });
    body.appendChild(row);
  }
}

/* ---------- 记事本（默认保存到“我的文档”） ---------- */
async function openNotepad(initial = '', fileName = '无标题', fileId = null, parentId = null) {
  const vfs = vfsRef;
  let currentFileId = fileId;
  let currentParentId = parentId;
  let currentFileName = fileName;

  const win = createWindow({
    title: `${currentFileName} - 记事本`,
    width: 560, height: 400,
    html: `
      <textarea class="notepad" spellcheck="false"></textarea>
      <div style="height:26px;display:flex;align-items:center;justify-content:flex-end;
                  gap:8px;padding:0 10px;background:#ece9d8;border-top:1px solid #aca899">
        <button id="npSave" style="font-family:inherit;padding:3px 14px;cursor:pointer">保存</button>
      </div>`
  });
  const ta = win.querySelector('.notepad');
  ta.value = initial;

  const save = async () => {
    const doc = await vfs.resolve('/Documents and Settings/Administrator/我的文档');
    if (currentFileId) {
      await vfs.writeFile(currentParentId, currentFileName, ta.value);
    } else {
      const defaultName = '无标题.txt';
      await vfs.writeFile(doc.id, defaultName, ta.value);
      const newFile = await vfs.find(doc.id, defaultName);
      if (newFile) {
        currentFileId = newFile.id;
        currentParentId = doc.id;
        currentFileName = defaultName;
      }
    }
    const titleEl = win.querySelector('.title');
    titleEl.textContent = '已保存 - 记事本';
    setTimeout(() => { titleEl.textContent = `${currentFileName} - 记事本`; }, 1200);
  };
  win.querySelector('#npSave').onclick = save;
  ta.focus();
}

/* ---------- IE（支持 iframe 加载真实网页） ---------- */
function openIE() {
  const win = createWindow({
    title: 'Internet Explorer', width: 700, height: 450,
    html: `
      <div style="display:flex;flex-direction:column;height:100%">
        <div style="padding:6px 10px;background:#ece9d8;border-bottom:1px solid #aca899;
                    display:flex;align-items:center;gap:8px">
          <span>◀ ▶ ⟳</span>
          <input id="ieUrl" type="text" value="https://example.com"
                 style="flex:1;background:#fff;border:1px solid #7f9db9;
                        padding:3px 6px;color:#333;outline:none">
          <button id="ieGo" style="font-family:inherit;padding:3px 12px;cursor:pointer">转到</button>
        </div>
        <div style="flex:1;background:#fff;position:relative">
          <iframe id="ieFrame" src="about:blank"
                  style="border:none;width:100%;height:100%;background:#fff"></iframe>
        </div>
      </div>`
  });

  const urlInput = win.querySelector('#ieUrl');
  const frame = win.querySelector('#ieFrame');

  const go = () => {
    let url = urlInput.value.trim();
    if (!url) return;

    // 智能补协议：IP / localhost 默认 http，其它默认 https
    if (!/^[a-z]+:\/\//i.test(url)) {
      if (/^(localhost|\d+\.\d+\.\d+\.\d+)(:\d+)?/.test(url)) {
        url = 'http://' + url;
      } else {
        url = 'https://' + url;
      }
    }
    urlInput.value = url;

    // ★ 关键：清除 srcdoc，否则 src 永远不会生效
    frame.removeAttribute('srcdoc');
    frame.src = url;
  };

  win.querySelector('#ieGo').onclick = go;
  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });

  // 初始欢迎页用 srcdoc 渲染，第一次点“转到”时会被清掉
  frame.srcdoc = `
    <div style="font-family:Tahoma,sans-serif;padding:24px;color:#333">
      <h1 style="color:#0054e3;font-size:24px;margin-bottom:8px">Welcome to Internet Explorer</h1>
      <p style="color:#666;margin-bottom:18px">输入网址，按回车或点击“转到”浏览网页。</p>
      <p style="line-height:1.8">
        注意：由于浏览器的 <b>X-Frame-Options</b> 安全限制，部分网站（如 Google、百度）可能会拒绝在 iframe 中显示。
      </p>
      <p style="line-height:1.8">
        可以试试 <a href="https://example.com" target="_blank">example.com</a> 或 <a href="https://www.bing.com" target="_blank">bing.com</a>。
      </p>
      <hr style="border:none;border-top:1px solid #ddd;margin:20px 0">
      <p style="color:#888;font-size:12px">© 2001 Microsoft Corporation</p>
    </div>
  `;
}

/* ---------- 回收站 ---------- */
function openRecycleBin() {
  createWindow({
    title: '回收站', width: 500, height: 320,
    html: `<div style="padding:22px;color:#888">回收站是空的。<br><br>
           <span style="font-size:11px">（那些被删掉的青春）</span></div>`
  });
}

/* ---------- 启动器 ---------- */
function launch(app) {
  if (app === '我的电脑') return openMyComputer();
  if (app === '记事本')   return openNotepad('', '无标题');
  if (app === '回收站')   return openRecycleBin();
  if (app === 'Internet Explorer') return openIE();
}

/* ---------- 桌面事件绑定 ---------- */
function bindDesktop() {
  const desktopEl = document.getElementById('desktop');
  const startMenu = document.getElementById('startMenu');

  document.getElementById('startBtn').onclick = e => {
    e.stopPropagation();
    startMenu.classList.toggle('open');
  };
  startMenu.addEventListener('mousedown', e => e.stopPropagation());
  document.addEventListener('mousedown', () => startMenu.classList.remove('open'));

  startMenu.querySelectorAll('.sm-item').forEach(el => {
    el.onclick = () => {
      startMenu.classList.remove('open');
      if (el.dataset.dir) {
        vfsRef.resolve(el.dataset.dir).then(n => n && openFolder(n.id, el.textContent.trim()));
      } else {
        launch(el.dataset.app);
      }
    };
  });

  document.querySelectorAll('.icon').forEach(el => {
    el.addEventListener('mousedown', e => {
      e.stopPropagation();
      document.querySelectorAll('.icon').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
    });
    el.addEventListener('dblclick', () => launch(el.dataset.app));
  });

  desktopEl.addEventListener('mousedown', e => {
    if (!e.target.closest('.window') && !e.target.closest('.icon')) {
      document.querySelectorAll('.icon').forEach(i => i.classList.remove('selected'));
    }
  });

  document.getElementById('shutdownBtn').onclick = async () => {
    const choice = prompt(
      '要关闭计算机吗？\n\n  1 = 关闭\n  2 = 恢复出厂设置（清空所有文件）',
      '1'
    );
    if (choice === '2') {
      if (confirm('确定要恢复出厂设置吗？所有文件将被清空。')) {
        await vfsRef.wipe();
        await vfsRef.setMeta('phase', '');
        await runTextSetup(vfsRef);
      }
    } else {
      const info = await inspectInstallation(vfsRef);
      if (info.state === 'installed') {
        await showBootSplash();
        await startDesktop(vfsRef);
      } else {
        await runTextSetup(vfsRef);
      }
    }
  };

  const tick = () => {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    document.getElementById('clock').textContent = `${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  tick();
  setInterval(tick, 1000);
}

/* ==================================================================
   12. 启动入口
   ================================================================== */
(async function boot() {
  document.body.tabIndex = -1;
  document.body.focus();
  window.focus();

  const vfs = await new VFS().init();
  const info = await inspectInstallation(vfs);

  switch (info.state) {
    case 'installed':
      await showBootSplash();
      await startDesktop(vfs);
      break;
    case 'corrupt':
      await showRepairPrompt(info, vfs);
      break;
    case 'resume-gui':
      await runGuiSetup(vfs);
      break;
    case 'resume-oobe':
      await runOobe(vfs);
      break;
    default:
      await runTextSetup(vfs);
  }
})();
</script>
